<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%" style="background-color: transparent; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#181818" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#181818" flood-opacity="0.03"/>
    </filter>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(36, 28)">
    <rect width="78" height="22" rx="4" fill="#EFEAE2" stroke="#DCD5CA" stroke-width="1"/>
    <text x="39" y="15" text-anchor="middle" font-size="10.5" font-weight="700" fill="#181818">TAHAP 04</text>
    
    <text x="92" y="16" font-size="16" font-weight="700" fill="#181818">Tingkat Bahaya &amp; Penjelasan Penyebab</text>
    <text x="0" y="40" font-size="12" font-weight="400" fill="#736B5E">Sistem langsung menunjukkan pemicu utama dan status stabilitas lingkungan kota ke dalam 4 tingkatan.</text>
  </g>

  <!-- ==================== 2 SPACIOUS PANELS ==================== -->
  <g transform="translate(36, 95)">
    <!-- LEFT PANEL: PENJELASAN PENYEBAB -->
    <g transform="translate(0, 0)">
      <rect width="380" height="260" rx="12" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.2" filter="url(#card-shadow)"/>
      
      <rect x="20" y="18" width="90" height="20" rx="4" fill="#EFEAE2"/>
      <text x="65" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#181818">TRANSPARAN</text>
      
      <text x="20" y="58" font-size="14" font-weight="700" fill="#181818">Penyebab Langsung Terlacak</text>

      <g transform="translate(20, 78)">
        <!-- Point 1 -->
        <g transform="translate(0, 0)">
          <circle cx="6" cy="8" r="3.5" fill="#181818"/>
          <text x="18" y="11" font-size="12" font-weight="700" fill="#181818">Mengetahui Pemicu Utama</text>
          <text x="18" y="27" font-size="11" font-weight="400" fill="#645E54">Contoh: Sisa genangan hujan atau lonjakan debu</text>
        </g>

        <!-- Point 2 -->
        <g transform="translate(0, 48)">
          <circle cx="6" cy="8" r="3.5" fill="#059669"/>
          <text x="18" y="11" font-size="12" font-weight="700" fill="#181818">Prediksi 1 Minggu s.d. 1 Bulan</text>
          <text x="18" y="27" font-size="11" font-weight="400" fill="#645E54">Melihat tren risiko ke depan sebelum korban jatuh</text>
        </g>

        <!-- Point 3 -->
        <g transform="translate(0, 96)">
          <circle cx="6" cy="8" r="3.5" fill="#181818"/>
          <text x="18" y="11" font-size="12" font-weight="700" fill="#181818">Solusi Otomatis Tepat Sasaran</text>
          <text x="18" y="27" font-size="11" font-weight="400" fill="#645E54">Penyebab yang ditemukan langsung tentukan aksi</text>
        </g>
      </g>

      <rect x="20" y="218" width="340" height="24" rx="4" fill="#FAF8F5"/>
      <text x="190" y="234" text-anchor="middle" font-size="10" font-weight="600" fill="#736B5E">Bukan Kotak Hitam (Explainable AI)</text>
    </g>

    <!-- RIGHT PANEL: 4 TIER STABILITY INDEX -->
    <g transform="translate(398, 0)">
      <rect width="450" height="260" rx="12" fill="#FFFFFF" stroke="#181818" stroke-width="1.3" filter="url(#card-shadow)"/>
      
      <!-- Panel Header & Scale Rule -->
      <g transform="translate(18, 14)">
        <text x="0" y="14" font-size="13" font-weight="700" fill="#181818">4 Tingkatan Skor Stabilitas Lingkungan Kota (0–100)</text>
        <text x="0" y="30" font-size="10" font-weight="700" fill="#059669">Skor TINGGI = Aman &amp; Stabil</text>
        <text x="210" y="30" font-size="10" font-weight="700" fill="#DC2626">Skor RENDAH = Bahaya / Kritis</text>
      </g>

      <!-- 4 Compact Crisp Tiers -->
      <g transform="translate(18, 52)">
        <!-- Level 4: Optimal / Stabil -->
        <g transform="translate(0, 0)">
          <rect width="414" height="42" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
          <circle cx="16" cy="21" r="5" fill="#059669"/>
          <text x="30" y="17" font-size="11.5" font-weight="700" fill="#065F46">Level 4: Optimal / Stabil (Skor 70 – 100)</text>
          <text x="30" y="32" font-size="10" font-weight="400" fill="#047857">Kondisi lingkungan aman &amp; terkendali, pemantauan rutin</text>
        </g>

        <!-- Level 3: Terkendali -->
        <g transform="translate(0, 48)">
          <rect width="414" height="42" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
          <circle cx="16" cy="21" r="5" fill="#1D4ED8"/>
          <text x="30" y="17" font-size="11.5" font-weight="700" fill="#1E40AF">Level 3: Terkendali / Aman (Skor 50 – 69)</text>
          <text x="30" y="32" font-size="10" font-weight="400" fill="#1D4ED8">Risiko rendah, pemantauan preventif lingkungan standar</text>
        </g>

        <!-- Level 2: Waspada -->
        <g transform="translate(0, 96)">
          <rect width="414" height="42" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
          <circle cx="16" cy="21" r="5" fill="#D97706"/>
          <text x="30" y="17" font-size="11.5" font-weight="700" fill="#92400E">Level 2: Waspada (Skor 30 – 49)</text>
          <text x="30" y="32" font-size="10" font-weight="400" fill="#B45309">Stabilitas menurun, ada potensi risiko 1–4 minggu ke depan</text>
        </g>

        <!-- Level 1: Kritis / Bahaya -->
        <g transform="translate(0, 144)">
          <rect width="414" height="42" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
          <circle cx="16" cy="21" r="5" fill="#DC2626"/>
          <text x="30" y="17" font-size="11.5" font-weight="700" fill="#991B1B">Level 1: Kritis / Bahaya Tinggi (Skor &lt; 30)</text>
          <text x="30" y="32" font-size="10" font-weight="400" fill="#B91C1C">Bahaya darurat, perlu tindakan fogging fokus dan mitigasi segera</text>
        </g>
      </g>

      <rect x="18" y="246" width="414" height="6" rx="3" fill="#E5E0D8"/>
    </g>
  </g>
</svg>
