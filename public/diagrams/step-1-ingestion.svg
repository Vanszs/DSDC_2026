<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%" style="background-color: transparent; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#181818" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#181818" flood-opacity="0.03"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#181818"/>
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(36, 28)">
    <rect width="78" height="22" rx="4" fill="#EFEAE2" stroke="#DCD5CA" stroke-width="1"/>
    <text x="39" y="15" text-anchor="middle" font-size="10.5" font-weight="700" fill="#181818">TAHAP 01</text>
    
    <text x="92" y="16" font-size="16" font-weight="700" fill="#181818">Pengumpulan Data Iklim Otomatis</text>
    <text x="0" y="40" font-size="12" font-weight="400" fill="#736B5E">Sistem mengumpulkan data cuaca harian dan prediksi 1 minggu hingga 1 bulan ke depan secara otomatis.</text>
  </g>

  <!-- ==================== 3-STEP HORIZONTAL FLOW ==================== -->
  <g transform="translate(36, 95)">
    <!-- STEP 1: SUMBER DATA (Left Box) -->
    <g transform="translate(0, 0)">
      <rect width="255" height="260" rx="12" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.2" filter="url(#card-shadow)"/>
      
      <rect x="18" y="18" width="70" height="20" rx="4" fill="#EFF6FF"/>
      <text x="53" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#1D4ED8">SUMBER DATA</text>
      <text x="18" y="58" font-size="14" font-weight="700" fill="#181818">3 Sumber Informasi</text>

      <!-- Item 1 -->
      <g transform="translate(18, 76)">
        <circle cx="5" cy="8" r="3" fill="#059669"/>
        <text x="16" y="10" font-size="12" font-weight="700" fill="#181818">Data Cuaca Real-time</text>
        <text x="16" y="26" font-size="11" font-weight="400" fill="#645E54">Suhu, hujan, kelembapan, angin</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(18, 126)">
        <circle cx="5" cy="8" r="3" fill="#1D4ED8"/>
        <text x="16" y="10" font-size="12" font-weight="700" fill="#181818">Rekam Jejak 30 Tahun</text>
        <text x="16" y="26" font-size="11" font-weight="400" fill="#645E54">11.688 hari riwayat iklim Semarang</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(18, 176)">
        <circle cx="5" cy="8" r="3" fill="#D97706"/>
        <text x="16" y="10" font-size="12" font-weight="700" fill="#181818">Peta Ketinggian Wilayah</text>
        <text x="16" y="26" font-size="11" font-weight="400" fill="#645E54">Pantai (0 m) s.d. Bukit (350 m)</text>
      </g>

      <rect x="18" y="222" width="219" height="22" rx="4" fill="#FAF8F5"/>
      <text x="127" y="237" text-anchor="middle" font-size="10" font-weight="600" fill="#736B5E">Cakupan Skala Kota Semarang</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 265 130 H 295" fill="none" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- STEP 2: PROSES PENARIKAN (Center Box) -->
    <g transform="translate(305, 0)">
      <rect width="255" height="260" rx="12" fill="#FFFFFF" stroke="#181818" stroke-width="1.5" filter="url(#card-shadow)"/>
      
      <rect x="18" y="18" width="60" height="20" rx="4" fill="#ECFDF5"/>
      <text x="48" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">PROSES</text>
      <text x="18" y="58" font-size="14" font-weight="700" fill="#181818">Otomatis Tanpa Input</text>

      <g transform="translate(18, 76)">
        <circle cx="5" cy="8" r="3" fill="#059669"/>
        <text x="16" y="10" font-size="12" font-weight="700" fill="#181818">Tarik Data Tiap Jam</text>
        <text x="16" y="26" font-size="11" font-weight="400" fill="#645E54">Berjalan otomatis tanpa input manual</text>
      </g>

      <g transform="translate(18, 126)">
        <circle cx="5" cy="8" r="3" fill="#059669"/>
        <text x="16" y="10" font-size="12" font-weight="700" fill="#181818">Pembersihan Data</text>
        <text x="16" y="26" font-size="11" font-weight="400" fill="#645E54">Memperbaiki data yang hilang/rusak</text>
      </g>

      <g transform="translate(18, 176)">
        <circle cx="5" cy="8" r="3" fill="#059669"/>
        <text x="16" y="10" font-size="12" font-weight="700" fill="#181818">Penyelarasan Waktu</text>
        <text x="16" y="26" font-size="11" font-weight="400" fill="#645E54">Data siap diolah dalam hitungan detik</text>
      </g>

      <rect x="18" y="222" width="219" height="22" rx="4" fill="#ECFDF5"/>
      <text x="127" y="237" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">Status: Aktif 24 Jam Non-Stop</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 570 130 H 600" fill="none" stroke="#181818" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- STEP 3: HASIL PENYIMPANAN (Right Box) -->
    <g transform="translate(610, 0)">
      <rect width="238" height="260" rx="12" fill="#181818" stroke="#000000" stroke-width="1.2" filter="url(#card-shadow)"/>
      
      <rect x="18" y="18" width="50" height="20" rx="4" fill="#333333"/>
      <text x="43" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#A7F3D0">HASIL</text>
      <text x="18" y="58" font-size="14" font-weight="700" fill="#FFFFFF">Penyimpanan Terpusat</text>

      <g transform="translate(18, 76)">
        <circle cx="5" cy="8" r="3" fill="#34D399"/>
        <text x="16" y="10" font-size="12" font-weight="700" fill="#FFFFFF">Database Terpadu</text>
        <text x="16" y="26" font-size="11" font-weight="400" fill="#A8A29E">Tersimpan aman di server lokal</text>
      </g>

      <g transform="translate(18, 126)">
        <circle cx="5" cy="8" r="3" fill="#34D399"/>
        <text x="16" y="10" font-size="12" font-weight="700" fill="#FFFFFF">Prediksi Berkelanjutan</text>
        <text x="16" y="26" font-size="11" font-weight="400" fill="#A8A29E">Horizon 1 minggu s.d. 1 bulan</text>
      </g>

      <g transform="translate(18, 176)">
        <circle cx="5" cy="8" r="3" fill="#34D399"/>
        <text x="16" y="10" font-size="12" font-weight="700" fill="#FFFFFF">Siap Digunakan AI</text>
        <text x="16" y="26" font-size="11" font-weight="400" fill="#A8A29E">Langsung masuk proses Tahap 02</text>
      </g>

      <rect x="18" y="222" width="202" height="22" rx="4" fill="#059669"/>
      <text x="119" y="237" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">➔ Lanjut ke Tahap 02</text>
    </g>
  </g>
</svg>
