<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" height="100%" style="background-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="card-shadow-1" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="glow-blue-1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="grad-pg-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arr-b-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
  </defs>

  <!-- Step Title Tag -->
  <g transform="translate(30, 25)">
    <rect width="130" height="30" rx="15" fill="#DBEAFE" />
    <text x="65" y="20" text-anchor="middle" font-size="12" font-weight="800" fill="#1D4ED8">LANGKAH 01</text>
    <text x="145" y="21" font-size="16" font-weight="800" fill="#0F172A">Bagaimana Kita Mendapatkan Data Iklim?</text>
  </g>

  <!-- ==================== SOURCES COLUMN ==================== -->
  <g transform="translate(30, 75)">
    <!-- Source 1: Open-Meteo ERA5 -->
    <g transform="translate(0, 0)">
      <rect width="250" height="78" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#card-shadow-1)" />
      <g transform="translate(14, 18)">
        <rect width="42" height="42" rx="10" fill="#EFF6FF" />
        <circle cx="18" cy="18" r="8" fill="#F59E0B" />
        <path d="M14 26 a7 7 0 0 1 13 -3 a5 5 0 0 1 8 3 a4 4 0 0 1 -1 7 h-20 a4 4 0 0 1 0 -7 z" fill="#3B82F6" />
      </g>
      <text x="68" y="34" font-size="13" font-weight="800" fill="#1E3A8A">Open-Meteo Live API</text>
      <text x="68" y="52" font-size="11" font-weight="500" fill="#64748B">Suhu, Hujan, Kelembapan, Angin</text>
    </g>

    <!-- Source 2: Data 30 Tahun -->
    <g transform="translate(0, 96)">
      <rect width="250" height="78" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#card-shadow-1)" />
      <g transform="translate(14, 18)">
        <rect width="42" height="42" rx="10" fill="#EFF6FF" />
        <text x="21" y="28" text-anchor="middle" font-size="20">📅</text>
      </g>
      <text x="68" y="34" font-size="13" font-weight="800" fill="#1E3A8A">Rekam Jejak 30 Tahun</text>
      <text x="68" y="52" font-size="11" font-weight="500" fill="#64748B">11.688 Hari Cuaca Kota Semarang</text>
    </g>

    <!-- Source 3: Topografi DEMNAS -->
    <g transform="translate(0, 192)">
      <rect width="250" height="78" rx="14" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5" filter="url(#card-shadow-1)" />
      <g transform="translate(14, 18)">
        <rect width="42" height="42" rx="10" fill="#FEF3C7" />
        <path d="M12 28 l8 -14 l6 8 l8 -12 l8 18 z" fill="#D97706" />
      </g>
      <text x="68" y="34" font-size="13" font-weight="800" fill="#92400E">Ketinggian Topografi</text>
      <text x="68" y="52" font-size="11" font-weight="500" fill="#64748B">Pantai (0 mdpl) s.d. Bukit (350 mdpl)</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 285 114 H 345 V 210 H 375" fill="none" stroke="#94A3B8" stroke-width="2" />
  <path d="M 285 210 H 375" fill="none" stroke="#94A3B8" stroke-width="2" />
  <path d="M 285 306 H 345 V 210 H 375" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-b-1)" />

  <!-- ==================== CENTER: PENARIK DATA OTOMATIS ==================== -->
  <g transform="translate(385, 95)">
    <rect width="240" height="250" rx="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" filter="url(#card-shadow-1)" />
    
    <g transform="translate(90, 24)">
      <circle cx="30" cy="30" r="26" fill="#EFF6FF" />
      <text x="30" y="38" text-anchor="middle" font-size="24">⚡</text>
    </g>

    <text x="120" y="118" text-anchor="middle" font-size="15" font-weight="800" fill="#1E3A8A">Pengunduh Otomatis</text>
    <text x="120" y="136" text-anchor="middle" font-size="11" font-weight="600" fill="#3B82F6">Sinkronisasi Tiap Jam</text>

    <!-- Penjelasan mudah -->
    <rect x="20" y="156" width="200" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="120" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Tanpa Perlu Input Manual</text>
    <text x="120" y="198" text-anchor="middle" font-size="10.5" font-weight="500" fill="#64748B">Sistem menarik data cuaca &amp;</text>
    <text x="120" y="214" text-anchor="middle" font-size="10.5" font-weight="500" fill="#64748B">ramalan 14 hari ke depan</text>
  </g>

  <!-- Connector to PostgreSQL -->
  <path d="M 625 220 H 680" fill="none" stroke="#3B82F6" stroke-width="3" marker-end="url(#arr-b-1)" />

  <!-- ==================== RIGHT: DATABASE PENYIMPANAN ==================== -->
  <g transform="translate(690, 90)">
    <rect width="200" height="260" rx="18" fill="url(#grad-pg-1)" filter="url(#glow-blue-1)" />
    
    <!-- PostgreSQL Cylinder Icon -->
    <g transform="translate(70, 24)">
      <ellipse cx="30" cy="18" rx="28" ry="10" fill="#60A5FA" />
      <path d="M2 18 v22 a28 10 0 0 0 56 0 v-22 z" fill="#3B82F6" />
      <ellipse cx="30" cy="18" rx="28" ry="10" fill="#93C5FD" />
      <path d="M2 44 v22 a28 10 0 0 0 56 0 v-22 z" fill="#1D4ED8" />
      <ellipse cx="30" cy="44" rx="28" ry="10" fill="#60A5FA" />
      <circle cx="20" cy="30" r="3" fill="#FFFFFF" />
      <circle cx="20" cy="56" r="3" fill="#FFFFFF" />
    </g>

    <text x="100" y="130" text-anchor="middle" font-size="14.5" font-weight="800" fill="#FFFFFF">Database PostgreSQL</text>
    <text x="100" y="148" text-anchor="middle" font-size="11" font-weight="600" fill="#93C5FD">Penyimpanan Terpusat</text>

    <rect x="25" y="175" width="150" height="32" rx="8" fill="#1E3A8A" />
    <text x="100" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#DBEAFE">Data Siap Diolah</text>

    <text x="100" y="235" text-anchor="middle" font-size="11.5" font-weight="700" fill="#93C5FD">➔ Lanjut ke Langkah 2</text>
  </g>
</svg>
