<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" height="100%" style="background-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="card-shadow-2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Step Title Tag -->
  <g transform="translate(30, 25)">
    <rect width="130" height="30" rx="15" fill="#CCFBF1" />
    <text x="65" y="20" text-anchor="middle" font-size="12" font-weight="800" fill="#0F766E">LANGKAH 02</text>
    <text x="145" y="21" font-size="16" font-weight="800" fill="#0F172A">Bagaimana Cuaca Diubah Menjadi Sinyal Risiko Penyakit?</text>
  </g>

  <!-- ==================== 3 FORMULA CARDS ==================== -->
  <g transform="translate(30, 75)">
    <!-- Card 1: Briere Formula (DBD) -->
    <g transform="translate(0, 0)">
      <rect width="270" height="295" rx="16" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" filter="url(#card-shadow-2)" />
      
      <rect x="18" y="18" width="234" height="32" rx="8" fill="#CCFBF1" />
      <text x="135" y="39" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0F766E">1. SUHU NYAMUK (DBD)</text>

      <!-- Briere Math Box -->
      <g transform="translate(15, 62)">
        <rect width="240" height="55" rx="8" fill="#F0FDFA" stroke="#99F6E4" />
        <text x="120" y="26" text-anchor="middle" font-size="11.5" font-family="Courier, monospace" font-weight="800" fill="#0F766E">S(T) = T·(T-16)·√(36-T)</text>
        <text x="120" y="44" text-anchor="middle" font-size="10.5" font-family="Courier, monospace" font-weight="700" fill="#14B8A6">───────────────── 1039.8</text>
      </g>

      <text x="18" y="145" font-size="12" font-weight="700" fill="#0F172A">Mengapa Rumus Ini?</text>
      <text x="18" y="166" font-size="11" font-weight="500" fill="#475569">• Nyamuk tidak aktif &lt;16°C</text>
      <text x="18" y="186" font-size="11" font-weight="500" fill="#475569">• Nyamuk mati kepanasan &gt;36°C</text>
      <text x="18" y="206" font-size="11" font-weight="700" fill="#059669">• Paling aktif menyengat di 28.5°C</text>

      <rect x="18" y="240" width="234" height="34" rx="8" fill="#CCFBF1" />
      <text x="135" y="261" text-anchor="middle" font-size="11" font-weight="800" fill="#0F766E">Kapasitas Replikasi Virus DBD</text>
    </g>

    <!-- Card 2: Gaussian Lag-14 DLNM Formula (DBD) -->
    <g transform="translate(295, 0)">
      <rect width="270" height="295" rx="16" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" filter="url(#card-shadow-2)" />
      
      <rect x="18" y="18" width="234" height="32" rx="8" fill="#CCFBF1" />
      <text x="135" y="39" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0F766E">2. JEDA HUJAN (DLNM)</text>

      <!-- Gaussian Lag Math Box -->
      <g transform="translate(15, 62)">
        <rect width="240" height="55" rx="8" fill="#F0FDFA" stroke="#99F6E4" />
        <text x="120" y="26" text-anchor="middle" font-size="10.5" font-family="Courier, monospace" font-weight="800" fill="#0F766E">w_k = (1/σ√2π)·e^(-(k-8)²/2σ²)</text>
        <text x="120" y="44" text-anchor="middle" font-size="10.5" font-family="Courier, monospace" font-weight="700" fill="#14B8A6">Distribusi Lag: 0 s.d. 14 Hari</text>
      </g>

      <text x="18" y="145" font-size="12" font-weight="700" fill="#0F172A">Mengapa Butuh Jeda Waktu?</text>
      <text x="18" y="166" font-size="11" font-weight="500" fill="#475569">• Hujan ciptakan genangan air</text>
      <text x="18" y="186" font-size="11" font-weight="500" fill="#475569">• Telur butuh 8 hari untuk menetas</text>
      <text x="18" y="206" font-size="11" font-weight="700" fill="#D97706">• Puncak ancaman di Hari ke-8</text>

      <rect x="18" y="240" width="234" height="34" rx="8" fill="#CCFBF1" />
      <text x="135" y="261" text-anchor="middle" font-size="11" font-weight="800" fill="#0F766E">Inkubasi Larva ➔ Nyamuk Dewasa</text>
    </g>

    <!-- Card 3: Lapse Rate & Stagnation Formula (ISPA & Topografi) -->
    <g transform="translate(590, 0)">
      <rect width="270" height="295" rx="16" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" filter="url(#card-shadow-2)" />
      
      <rect x="18" y="18" width="234" height="32" rx="8" fill="#CCFBF1" />
      <text x="135" y="39" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0F766E">3. TOPOGRAFI &amp; ISPA</text>

      <!-- Lapse Rate Math Box -->
      <g transform="translate(15, 62)">
        <rect width="240" height="55" rx="8" fill="#F0FDFA" stroke="#99F6E4" />
        <text x="120" y="25" text-anchor="middle" font-size="10.5" font-family="Courier, monospace" font-weight="800" fill="#0F766E">T_lokal = T - 0.0065·(h - 65)</text>
        <text x="120" y="43" text-anchor="middle" font-size="10" font-family="Courier, monospace" font-weight="700" fill="#14B8A6">Ventilasi = 1.0 - (v_wind / 28)</text>
      </g>

      <text x="18" y="145" font-size="12" font-weight="700" fill="#0F172A">Kondisi 16 Kecamatan:</text>
      <text x="18" y="166" font-size="11" font-weight="500" fill="#475569">• Daerah perbukitan lebih sejuk</text>
      <text x="18" y="186" font-size="11" font-weight="500" fill="#475569">• Angin tenang jebak polutan</text>
      <text x="18" y="206" font-size="11" font-weight="700" fill="#DC2626">• PM2.5 tinggi picu lonjakan ISPA</text>

      <rect x="18" y="240" width="234" height="34" rx="8" fill="#CCFBF1" />
      <text x="135" y="261" text-anchor="middle" font-size="11" font-weight="800" fill="#0F766E">Koreksi Ketinggian Spasial</text>
    </g>
  </g>
</svg>
