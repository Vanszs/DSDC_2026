<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%" style="background-color: transparent; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#181818" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#181818" flood-opacity="0.03"/>
    </filter>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(36, 28)">
    <rect width="78" height="22" rx="4" fill="#EFEAE2" stroke="#DCD5CA" stroke-width="1"/>
    <text x="39" y="15" text-anchor="middle" font-size="10.5" font-weight="700" fill="#181818">TAHAP 02</text>
    
    <text x="92" y="16" font-size="16" font-weight="700" fill="#181818">Bagaimana Cuaca Mempengaruhi Risiko Penyakit?</text>
    <text x="0" y="40" font-size="12" font-weight="400" fill="#736B5E">Mengubah data cuaca menjadi 3 indikator biologis yang memicu penularan DBD dan ISPA.</text>
  </g>

  <!-- ==================== 3 CLEAR COMPARATIVE CARDS ==================== -->
  <g transform="translate(36, 95)">
    <!-- CARD 1: SUHU DBD -->
    <g transform="translate(0, 0)">
      <rect width="270" height="260" rx="12" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.2" filter="url(#card-shadow)"/>
      
      <rect x="18" y="18" width="80" height="20" rx="4" fill="#ECFDF5"/>
      <text x="58" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">VEKTOR DBD</text>
      
      <text x="18" y="58" font-size="14" font-weight="700" fill="#181818">1. Suhu &amp; Nyamuk</text>

      <!-- Key Callout Box -->
      <rect x="18" y="72" width="234" height="48" rx="6" fill="#FAF8F5" stroke="#E5E0D8" stroke-width="1"/>
      <text x="135" y="94" text-anchor="middle" font-size="14" font-weight="800" fill="#059669">28.5°C</text>
      <text x="135" y="110" text-anchor="middle" font-size="10.5" font-weight="500" fill="#645E54">Suhu paling berbahaya untuk DBD</text>

      <!-- Simple Bullets -->
      <g transform="translate(18, 134)">
        <circle cx="4" cy="7" r="2.5" fill="#181818"/>
        <text x="14" y="11" font-size="11.5" font-weight="400" fill="#44403C">Di bawah 16°C nyamuk tidak aktif</text>

        <circle cx="4" cy="27" r="2.5" fill="#181818"/>
        <text x="14" y="31" font-size="11.5" font-weight="400" fill="#44403C">Di atas 36°C nyamuk mati kepanasan</text>

        <circle cx="4" cy="47" r="2.5" fill="#059669"/>
        <text x="14" y="51" font-size="11.5" font-weight="700" fill="#059669">Suhu hangat percepat virus DBD</text>
      </g>

      <rect x="18" y="218" width="234" height="24" rx="4" fill="#ECFDF5"/>
      <text x="135" y="234" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">Indikator Daya Tahan Vektor</text>
    </g>

    <!-- CARD 2: JEDA WAKTU HUJAN (LAG-14) -->
    <g transform="translate(288, 0)">
      <rect width="270" height="260" rx="12" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.2" filter="url(#card-shadow)"/>
      
      <rect x="18" y="18" width="90" height="20" rx="4" fill="#FFFBEB"/>
      <text x="63" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#D97706">JEDA WAKTU</text>
      
      <text x="18" y="58" font-size="14" font-weight="700" fill="#181818">2. Genangan Pasca-Hujan</text>

      <!-- Key Callout Box -->
      <rect x="18" y="72" width="234" height="48" rx="6" fill="#FAF8F5" stroke="#E5E0D8" stroke-width="1"/>
      <text x="135" y="94" text-anchor="middle" font-size="14" font-weight="800" fill="#D97706">Hari ke-8</text>
      <text x="135" y="110" text-anchor="middle" font-size="10.5" font-weight="500" fill="#645E54">Puncak menetasnya jentik nyamuk</text>

      <!-- Simple Bullets -->
      <g transform="translate(18, 134)">
        <circle cx="4" cy="7" r="2.5" fill="#181818"/>
        <text x="14" y="11" font-size="11.5" font-weight="400" fill="#44403C">Hujan ciptakan genangan air bersih</text>

        <circle cx="4" cy="27" r="2.5" fill="#181818"/>
        <text x="14" y="31" font-size="11.5" font-weight="400" fill="#44403C">Telur butuh 8 hari untuk dewasa</text>

        <circle cx="4" cy="47" r="2.5" fill="#D97706"/>
        <text x="14" y="51" font-size="11.5" font-weight="700" fill="#D97706">Ancaman muncul 1–2 minggu lagi</text>
      </g>

      <rect x="18" y="218" width="234" height="24" rx="4" fill="#FFFBEB"/>
      <text x="135" y="234" text-anchor="middle" font-size="10" font-weight="700" fill="#D97706">Indikator Siklus Hidup Jentik</text>
    </g>

    <!-- CARD 3: POLUSI & ISPA -->
    <g transform="translate(576, 0)">
      <rect width="270" height="260" rx="12" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.2" filter="url(#card-shadow)"/>
      
      <rect x="18" y="18" width="80" height="20" rx="4" fill="#EFF6FF"/>
      <text x="58" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#1D4ED8">UDARA &amp; ISPA</text>
      
      <text x="18" y="58" font-size="14" font-weight="700" fill="#181818">3. Polusi &amp; Topografi</text>

      <!-- Key Callout Box -->
      <rect x="18" y="72" width="234" height="48" rx="6" fill="#FAF8F5" stroke="#E5E0D8" stroke-width="1"/>
      <text x="135" y="94" text-anchor="middle" font-size="14" font-weight="800" fill="#1D4ED8">Debu PM2.5</text>
      <text x="135" y="110" text-anchor="middle" font-size="10.5" font-weight="500" fill="#645E54">Polusi terjebak saat angin tenang</text>

      <!-- Simple Bullets -->
      <g transform="translate(18, 134)">
        <circle cx="4" cy="7" r="2.5" fill="#181818"/>
        <text x="14" y="11" font-size="11.5" font-weight="400" fill="#44403C">Perbukitan memiliki suhu lebih sejuk</text>

        <circle cx="4" cy="27" r="2.5" fill="#181818"/>
        <text x="14" y="31" font-size="11.5" font-weight="400" fill="#44403C">Angin lemah menjebak asap &amp; debu</text>

        <circle cx="4" cy="47" r="2.5" fill="#1D4ED8"/>
        <text x="14" y="51" font-size="11.5" font-weight="700" fill="#1D4ED8">Memicu lonjakan radang ISPA di kota</text>
      </g>

      <rect x="18" y="218" width="234" height="24" rx="4" fill="#EFF6FF"/>
      <text x="135" y="234" text-anchor="middle" font-size="10" font-weight="700" fill="#1D4ED8">Indikator Kualitas Udara Kota</text>
    </g>
  </g>
</svg>
