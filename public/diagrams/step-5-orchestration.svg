<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%" style="background-color: transparent; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#181818" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#181818" flood-opacity="0.03"/>
    </filter>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(36, 28)">
    <rect width="78" height="22" rx="4" fill="#EFEAE2" stroke="#DCD5CA" stroke-width="1"/>
    <text x="39" y="15" text-anchor="middle" font-size="10.5" font-weight="700" fill="#181818">TAHAP 05</text>
    
    <text x="92" y="16" font-size="16" font-weight="700" fill="#181818">Tindakan Pencegahan &amp; Tanggap Darurat</text>
    <text x="0" y="40" font-size="12" font-weight="400" fill="#736B5E">Membantu Dinas Kesehatan dan Pemkot bertindak cepat sebelum wabah dan lonjakan kasus terjadi.</text>
  </g>

  <!-- ==================== 4 ACTIONABLE MODULES (2x2 GRID) ==================== -->
  <g transform="translate(36, 95)">
    <!-- MODULE 1: PETA WILAYAH -->
    <g transform="translate(0, 0)">
      <rect width="415" height="122" rx="12" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.2" filter="url(#card-shadow)"/>
      <rect x="14" y="14" width="4" height="94" rx="2" fill="#DC2626"/>
      
      <g transform="translate(26, 16)">
        <rect width="90" height="18" rx="3" fill="#FEF2F2"/>
        <text x="45" y="13" text-anchor="middle" font-size="9.5" font-weight="700" fill="#DC2626">TITIK MERAH</text>
        <text x="0" y="38" font-size="13.5" font-weight="700" fill="#181818">1. Pemetaan Wilayah Kota</text>
        <text x="0" y="58" font-size="11" font-weight="400" fill="#645E54">Zona wilayah dengan skor rendah (&lt;30) ditandai merah</text>
        <text x="0" y="74" font-size="11" font-weight="600" fill="#DC2626">Menjadi prioritas intervensi tanggap darurat kota.</text>
      </g>
    </g>

    <!-- MODULE 2: FOGGING -->
    <g transform="translate(433, 0)">
      <rect width="415" height="122" rx="12" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.2" filter="url(#card-shadow)"/>
      <rect x="14" y="14" width="4" height="94" rx="2" fill="#D97706"/>
      
      <g transform="translate(26, 16)">
        <rect width="90" height="18" rx="3" fill="#FFFBEB"/>
        <text x="45" y="13" text-anchor="middle" font-size="9.5" font-weight="700" fill="#D97706">TEPAT WAKTU</text>
        <text x="0" y="38" font-size="13.5" font-weight="700" fill="#181818">2. Fogging Fokus Tepat Waktu</text>
        <text x="0" y="58" font-size="11" font-weight="400" fill="#645E54">Dilakukan 3–5 hari sebelum jentik nyamuk dewasa,</text>
        <text x="0" y="74" font-size="11" font-weight="600" fill="#D97706">berdasarkan prediksi dini 1 minggu s.d. 1 bulan ke depan.</text>
      </g>
    </g>

    <!-- MODULE 3: PSN 3M+ -->
    <g transform="translate(0, 138)">
      <rect width="415" height="122" rx="12" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.2" filter="url(#card-shadow)"/>
      <rect x="14" y="14" width="4" height="94" rx="2" fill="#059669"/>
      
      <g transform="translate(26, 16)">
        <rect width="90" height="18" rx="3" fill="#ECFDF5"/>
        <text x="45" y="13" text-anchor="middle" font-size="9.5" font-weight="700" fill="#059669">PEMBERSIHAN</text>
        <text x="0" y="38" font-size="13.5" font-weight="700" fill="#181818">3. Pembersihan Genangan (PSN 3M+)</text>
        <text x="0" y="58" font-size="11" font-weight="400" fill="#645E54">Menggerakkan kader Jumantik membersihkan genangan air</text>
        <text x="0" y="74" font-size="11" font-weight="600" fill="#059669">dan menabur bubuk abate di wilayah rawan.</text>
      </g>
    </g>

    <!-- MODULE 4: FASKES -->
    <g transform="translate(433, 138)">
      <rect width="415" height="122" rx="12" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.2" filter="url(#card-shadow)"/>
      <rect x="14" y="14" width="4" height="94" rx="2" fill="#1D4ED8"/>
      
      <g transform="translate(26, 16)">
        <rect width="90" height="18" rx="3" fill="#EFF6FF"/>
        <text x="45" y="13" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1D4ED8">FASKES SIAGA</text>
        <text x="0" y="38" font-size="13.5" font-weight="700" fill="#181818">4. Kesiapsiagaan Rumah Sakit &amp; Faskes</text>
        <text x="0" y="58" font-size="11" font-weight="400" fill="#645E54">Menyiapkan ranjang dan stok obat 1 bulan lebih awal</text>
        <text x="0" y="74" font-size="11" font-weight="600" fill="#1D4ED8">sebelum lonjakan pasien DBD dan ISPA terjadi.</text>
      </g>
    </g>
  </g>
</svg>
