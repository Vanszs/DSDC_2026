<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" height="100%" style="background-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="card-shadow-5" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Step Title Tag -->
  <g transform="translate(30, 25)">
    <rect width="130" height="30" rx="15" fill="#FFE4E6" />
    <text x="65" y="20" text-anchor="middle" font-size="12" font-weight="800" fill="#BE123C">LANGKAH 05</text>
    <text x="145" y="21" font-size="16" font-weight="800" fill="#0F172A">Bagaimana Sistem Merumuskan Solusi &amp; Tindakan Nyata?</text>
  </g>

  <!-- ==================== 4 ACTIONABLE SOLUTION CARDS (2x2 GRID) ==================== -->
  <g transform="translate(30, 75)">
    <!-- Card 1: MapLibre GL Map -->
    <g transform="translate(0, 0)">
      <rect width="410" height="140" rx="16" fill="#FFFFFF" stroke="#FDA4AF" stroke-width="1.5" filter="url(#card-shadow-5)" />
      <g transform="translate(20, 20)">
        <rect width="46" height="46" rx="10" fill="#FFE4E6" />
        <path d="M12 14 l7 -3 l10 3 l7 -3 v22 l-7 3 l-10 -3 l-7 3 z" fill="none" stroke="#E11D48" stroke-width="2" stroke-linejoin="round" />
        <circle cx="27" cy="23" r="3" fill="#E11D48" />
      </g>
      <text x="78" y="38" font-size="14" font-weight="800" fill="#0F172A">Peta Wilayah MapLibre GL</text>
      <text x="78" y="56" font-size="11" font-weight="600" fill="#E11D48">Kecamatan Mana yang Paling Terancam</text>
      
      <rect x="20" y="82" width="370" height="38" rx="8" fill="#FFF1F2" />
      <text x="35" y="106" font-size="11" font-weight="600" fill="#9F1239">Peta warna 16 kecamatan langsung tunjukkan titik prioritas</text>
    </g>

    <!-- Card 2: Fogging Fokus Tepat Waktu -->
    <g transform="translate(450, 0)">
      <rect width="410" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow-5)" />
      <g transform="translate(20, 20)">
        <rect width="46" height="46" rx="10" fill="#FEF3C7" />
        <circle cx="23" cy="23" r="14" fill="none" stroke="#D97706" stroke-width="2" />
        <circle cx="23" cy="23" r="4" fill="#D97706" />
      </g>
      <text x="78" y="38" font-size="14" font-weight="800" fill="#0F172A">Penyemprotan Fogging Tepat Sasaran</text>
      <text x="78" y="56" font-size="11" font-weight="600" fill="#D97706">Dilakukan 3–5 Hari SEBELUM Nyamuk Meledak</text>

      <rect x="20" y="82" width="370" height="38" rx="8" fill="#FFFBEB" />
      <text x="35" y="106" font-size="10.5" font-weight="600" fill="#92400E">Mencegah ledakan kasus, bukan menyemprot sesudah korban jatuh</text>
    </g>

    <!-- Card 3: PSN & Pembersihan Genangan -->
    <g transform="translate(0, 155)">
      <rect width="410" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow-5)" />
      <g transform="translate(20, 20)">
        <rect width="46" height="46" rx="10" fill="#ECFDF5" />
        <path d="M14 24 l6 6 l14 -14" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />
      </g>
      <text x="78" y="38" font-size="14" font-weight="800" fill="#0F172A">Pemberantasan Sarang Nyamuk (3M+)</text>
      <text x="78" y="56" font-size="11" font-weight="600" fill="#059669">Edukasi Warga &amp; Pembagian Bubuk Abate</text>

      <rect x="20" y="82" width="370" height="38" rx="8" fill="#F0FDF4" />
      <text x="35" y="106" font-size="11" font-weight="600" fill="#065F46">Membersihkan genangan air sebelum telur nyamuk menetas</text>
    </g>

    <!-- Card 4: Kesiapan Rumah Sakit & Faskes -->
    <g transform="translate(450, 155)">
      <rect width="410" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow-5)" />
      <g transform="translate(20, 20)">
        <rect width="46" height="46" rx="10" fill="#EFF6FF" />
        <path d="M12 26 h22 M12 18 h8 a5 5 0 0 1 5 5 v3 M12 32 v-16 M34 32 v-9" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="16" cy="16" r="2.5" fill="#3B82F6" />
      </g>
      <text x="78" y="38" font-size="14" font-weight="800" fill="#0F172A">Kesiapsiagaan Rumah Sakit &amp; Faskes</text>
      <text x="78" y="56" font-size="11" font-weight="600" fill="#2563EB">Penyiapan Ranjang &amp; Stok Obat Lebih Awal</text>

      <rect x="20" y="82" width="370" height="38" rx="8" fill="#EFF6FF" />
      <text x="35" y="106" font-size="10.5" font-weight="600" fill="#1E40AF">Puskesmas sudah siaga sebelum rumah sakit darurat penuh</text>
    </g>
  </g>
</svg>
