<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%" style="background-color: transparent; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#181818" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#181818" flood-opacity="0.03"/>
    </filter>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(36, 28)">
    <rect width="78" height="22" rx="4" fill="#EFEAE2" stroke="#DCD5CA" stroke-width="1"/>
    <text x="39" y="15" text-anchor="middle" font-size="10.5" font-weight="700" fill="#181818">TAHAP 03</text>
    
    <text x="92" y="16" font-size="16" font-weight="700" fill="#181818">Pengolahan Model AI (Machine Learning)</text>
    <text x="0" y="40" font-size="12" font-weight="400" fill="#736B5E">Model AI menghitung bobot pengaruh cuaca dari pola 30 tahun untuk menghasilkan skor risiko.</text>
  </g>

  <!-- ==================== 2 SPACIOUS PANELS ==================== -->
  <g transform="translate(36, 95)">
    <!-- LEFT PANEL: CARA KERJA MODEL -->
    <g transform="translate(0, 0)">
      <rect width="415" height="260" rx="12" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.2" filter="url(#card-shadow)"/>
      
      <rect x="20" y="18" width="80" height="20" rx="4" fill="#EFEAE2"/>
      <text x="60" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#181818">CARA KERJA</text>
      
      <text x="20" y="58" font-size="14" font-weight="700" fill="#181818">Pembelajaran dari Data 30 Tahun</text>

      <g transform="translate(20, 78)">
        <!-- Point 1 -->
        <g transform="translate(0, 0)">
          <circle cx="6" cy="8" r="3.5" fill="#059669"/>
          <text x="18" y="11" font-size="12" font-weight="700" fill="#181818">Menganalisis 11.688 Hari Cuaca Nyata</text>
          <text x="18" y="27" font-size="11" font-weight="400" fill="#645E54">Mempelajari keterkaitan iklim ekstrem dengan riwayat kasus</text>
        </g>

        <!-- Point 2 -->
        <g transform="translate(0, 48)">
          <circle cx="6" cy="8" r="3.5" fill="#059669"/>
          <text x="18" y="11" font-size="12" font-weight="700" fill="#181818">Menghitung Bobot Risiko Terkuat</text>
          <text x="18" y="27" font-size="11" font-weight="400" fill="#645E54">Mengidentifikasi porsi pengaruh curah hujan, suhu, dan PM2.5</text>
        </g>

        <!-- Point 3 -->
        <g transform="translate(0, 96)">
          <circle cx="6" cy="8" r="3.5" fill="#059669"/>
          <text x="18" y="11" font-size="12" font-weight="700" fill="#181818">Komputasi Cepat &amp; Ringan (&lt; 1 ms)</text>
          <text x="18" y="27" font-size="11" font-weight="400" fill="#645E54">Berjalan instan di peramban tanpa server berat</text>
        </g>
      </g>

      <rect x="20" y="218" width="375" height="24" rx="4" fill="#FAF8F5"/>
      <text x="207" y="234" text-anchor="middle" font-size="10" font-weight="600" fill="#736B5E">Model Matematika: L2 Ridge Regression</text>
    </g>

    <!-- RIGHT PANEL: HASIL AKURASI -->
    <g transform="translate(433, 0)">
      <rect width="415" height="260" rx="12" fill="#181818" stroke="#000000" stroke-width="1.2" filter="url(#card-shadow)"/>
      
      <rect x="20" y="18" width="80" height="20" rx="4" fill="#333333"/>
      <text x="60" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#34D399">HASIL UJI</text>
      
      <text x="20" y="58" font-size="14" font-weight="700" fill="#FFFFFF">Tingkat Keandalan Prediksi</text>

      <!-- 2 Big Metric Stat Cards -->
      <g transform="translate(20, 78)">
        <!-- Stat 1 -->
        <g transform="translate(0, 0)">
          <rect width="180" height="74" rx="8" fill="#242424" stroke="#383838" stroke-width="1"/>
          <text x="16" y="22" font-size="10" font-weight="600" fill="#A8A29E">AKURASI PREDIKSI</text>
          <text x="16" y="54" font-size="24" font-weight="800" fill="#FFFFFF">94.1%</text>
          <text x="96" y="54" font-size="11" font-weight="500" fill="#34D399">Tinggi</text>
        </g>

        <!-- Stat 2 -->
        <g transform="translate(195, 0)">
          <rect width="180" height="74" rx="8" fill="#242424" stroke="#383838" stroke-width="1"/>
          <text x="16" y="22" font-size="10" font-weight="600" fill="#A8A29E">DETEKSI BAHAYA</text>
          <text x="16" y="54" font-size="24" font-weight="800" fill="#34D399">97.8%</text>
          <text x="96" y="54" font-size="11" font-weight="500" fill="#34D399">Peka</text>
        </g>
      </g>

      <!-- Testing Dataset Proof -->
      <g transform="translate(20, 166)">
        <rect width="375" height="40" rx="6" fill="#242424" stroke="#383838" stroke-width="1"/>
        <text x="187" y="24" text-anchor="middle" font-size="11" font-weight="500" fill="#D6D3D1">Teruji pada <tspan font-weight="700" fill="#FFFFFF">1.752 Hari</tspan> Data Cuaca Nyata (2021–2025)</text>
      </g>

      <rect x="20" y="218" width="375" height="24" rx="4" fill="#059669"/>
      <text x="207" y="234" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Terverifikasi Akurat untuk Kota Semarang</text>
    </g>
  </g>
</svg>
