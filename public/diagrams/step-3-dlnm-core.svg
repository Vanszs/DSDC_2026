<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" height="100%" style="background-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="card-shadow-3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="glow-emerald-3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#059669" flood-opacity="0.15"/>
    </filter>
    <marker id="arr-e-3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Step Title Tag -->
  <g transform="translate(30, 25)">
    <rect width="130" height="30" rx="15" fill="#D1FAE5" />
    <text x="65" y="20" text-anchor="middle" font-size="12" font-weight="800" fill="#065F46">LANGKAH 03</text>
    <text x="145" y="21" font-size="16" font-weight="800" fill="#0F172A">Bagaimana Model Menghitung Skor Bahaya Penyakit?</text>
  </g>

  <!-- ==================== LEFT: RUMUS RIDGE ==================== -->
  <g transform="translate(30, 75)">
    <rect width="410" height="295" rx="16" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#card-shadow-3)" />
    
    <rect x="20" y="20" width="370" height="32" rx="8" fill="#D1FAE5" />
    <text x="205" y="41" text-anchor="middle" font-size="12" font-weight="800" fill="#065F46">RUMUS PEMBOBOTAN RISIKO (L2 RIDGE REGRESSION)</text>

    <!-- Formula Box -->
    <g transform="translate(20, 65)">
      <rect width="370" height="55" rx="8" fill="#F0FDF4" stroke="#A7F3D0" />
      <text x="185" y="34" text-anchor="middle" font-size="15" font-family="Courier, monospace" font-weight="800" fill="#047857">W = (Xᵀ·X + λI*)⁻¹ · Xᵀ·y</text>
    </g>

    <text x="20" y="145" font-size="12" font-weight="700" fill="#0F172A">Apa Arti Rumus Ini?</text>
    <text x="20" y="166" font-size="11" font-weight="500" fill="#475569">• Mencari nilai bobot pengaruh cuaca paling akurat</text>
    <text x="20" y="186" font-size="11" font-weight="500" fill="#475569">• Dilatih dari data 30 tahun (11.688 hari cuaca nyata)</text>
    <text x="20" y="206" font-size="11" font-weight="700" fill="#059669">• Parameter λ=0.01 mencegah model over-fitting</text>

    <!-- Bobot Terlatih -->
    <g transform="translate(20, 230)">
      <rect width="115" height="34" rx="6" fill="#ECFDF5" />
      <text x="57" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">Hujan: +5.37</text>

      <rect x="128" width="115" height="34" rx="6" fill="#ECFDF5" />
      <text x="185" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">Suhu: +4.40</text>

      <rect x="255" width="115" height="34" rx="6" fill="#ECFDF5" />
      <text x="312" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">PM2.5: +6.79</text>
    </g>
  </g>

  <!-- Connector -->
  <path d="M 445 220 H 475" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arr-e-3)" />

  <!-- ==================== RIGHT: HASIL AKURASI MODEL ==================== -->
  <g transform="translate(480, 75)">
    <rect width="410" height="295" rx="16" fill="#06281E" stroke="#059669" stroke-width="2" filter="url(#glow-emerald-3)" />
    
    <text x="205" y="45" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">Hasil Pengujian pada Data Nyata</text>
    <text x="205" y="65" text-anchor="middle" font-size="11" font-weight="500" fill="#A7F3D0">Diuji pada 1.752 Hari (Periode 2021–2025)</text>

    <!-- 3 Big Metric Badges -->
    <g transform="translate(25, 85)">
      <rect width="170" height="75" rx="10" fill="#064E3B" stroke="#059669" />
      <text x="85" y="32" text-anchor="middle" font-size="11" font-weight="600" fill="#A7F3D0">Tingkat Akurasi (R²)</text>
      <text x="85" y="58" text-anchor="middle" font-size="22" font-weight="900" fill="#FFFFFF">94.14%</text>

      <rect x="190" width="170" height="75" rx="10" fill="#064E3B" stroke="#059669" />
      <text x="275" y="32" text-anchor="middle" font-size="11" font-weight="600" fill="#A7F3D0">Sensitivitas Bahaya</text>
      <text x="275" y="58" text-anchor="middle" font-size="22" font-weight="900" fill="#34D399">97.86%</text>
    </g>

    <g transform="translate(25, 175)">
      <rect width="360" height="75" rx="10" fill="#065F46" />
      <text x="180" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Kecepatan Komputasi Super Cepat</text>
      <text x="180" y="52" text-anchor="middle" font-size="20" font-weight="900" fill="#6EE7B7">&lt; 1 Milidetik (Instan)</text>
    </g>
  </g>
</svg>
